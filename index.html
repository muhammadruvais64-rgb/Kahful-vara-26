<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Noto Sans Malayalam',sans-serif;
    background:#ffffff;
    color:#173f33;
    overflow-x:hidden;
}

button,
select{
    font:inherit;
}

button{
    cursor:pointer;
}


/* ==================================================
   OPENING
================================================== */

#opening{
    position:fixed;
    inset:0;
    z-index:99999;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:#071c16;

    transition:
        transform 1s cubic-bezier(.77,0,.18,1);
}

.opening-bg{
    position:absolute;
    inset:-50px;

    background:
        url("main-logo.png")
        center/cover no-repeat;

    filter:blur(35px);

    opacity:.18;

    transform:scale(1.15);
}

.opening-overlay{
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.55),
            rgba(0,0,0,.70)
        );
}

.opening-content{
    position:relative;
    z-index:5;

    text-align:center;

    width:100%;
}

.opening-logo{
    width:min(78vw,430px);

    max-height:65vh;

    object-fit:contain;

    filter:
        drop-shadow(
            0 20px 35px
            rgba(0,0,0,.45)
        );
}

.swipe{
    margin-top:28px;

    color:
        rgba(255,255,255,.85);

    font-family:Arial,sans-serif;

    font-size:10px;

    letter-spacing:4px;
}

.swipe-line{
    width:1px;
    height:45px;

    background:
        linear-gradient(
            transparent,
            white,
            transparent
        );

    margin:
        0 auto 12px;

    animation:
        swipeAnimation 1.6s infinite;
}

@keyframes swipeAnimation{

    0%{
        transform:translateY(-8px);
        opacity:0;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:translateY(8px);
        opacity:0;
    }
}


/* ==================================================
   PAGES
================================================== */

.page{
    display:none;

    min-height:100vh;
}

.page.active{
    display:block;

    animation:
        pageIn .65s ease;
}

@keyframes pageIn{

    from{
        opacity:0;
        transform:translateY(18px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* ==================================================
   GOLD DECORATION
================================================== */

.gold-line{

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #c8a85b,
            #ead99f,
            #c8a85b,
            transparent
        );
}


/* ==================================================
   HOME
================================================== */

#home{

    background:#ffffff;

    min-height:100vh;

    padding:
        28px
        16px
        70px;

    position:relative;

    overflow:hidden;
}

.home-wrapper{

    width:min(1050px,94%);

    margin:auto;
}


/* ==================================================
   HOME BRAND BOX
================================================== */

.brand-box{

    position:relative;

    min-height:410px;

    border-radius:
        0
        0
        42px
        42px;

    background:
        linear-gradient(
            145deg,
            #164b3d,
            #0b3027
        );

    box-shadow:

        0 28px 60px
        rgba(15,63,49,.24),

        inset
        0 1px 0
        rgba(255,255,255,.16);

    padding:
        45px
        25px
        40px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    overflow:hidden;
}

.brand-box::before{

    content:"";

    position:absolute;

    inset:12px;

    border:
        1px solid
        rgba(210,175,92,.75);

    border-radius:
        0
        0
        32px
        32px;

    pointer-events:none;
}

.brand-box::after{

    content:"";

    position:absolute;

    width:220px;
    height:220px;

    border-radius:50%;

    background:
        rgba(218,193,122,.08);

    filter:blur(8px);

    top:-110px;
    right:-80px;
}

.brand-logos{

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:
        clamp(
            20px,
            7vw,
            80px
        );

    position:relative;

    z-index:2;
}

.logo-card{

    width:42%;

    max-width:320px;

    display:flex;

    justify-content:center;

    align-items:center;
}

.logo-card img{

    width:100%;

    max-height:230px;

    object-fit:contain;

    filter:
        drop-shadow(
            0 12px 18px
            rgba(0,0,0,.20)
        );
}


/* ==================================================
   DESCRIPTION
================================================== */

.brand-description{

    position:relative;

    z-index:2;

    margin-top:32px;

    text-align:center;

    color:#ffffff;

    font-family:
        'Playfair Display',
        serif;

    font-size:
        clamp(
            13px,
            3vw,
            20px
        );

    letter-spacing:1.2px;
}

.brand-description span{

    color:#d9c17a;
}


/* ==================================================
   RESULT HOME BUTTON
================================================== */

.home-result{

    margin-top:35px;

    display:flex;

    justify-content:flex-start;
}

.result-home-button{

    border:
        1px solid
        rgba(200,168,91,.75);

    color:#ffffff;

    background:
        linear-gradient(
            145deg,
            #174f40,
            #0d362c
        );

    padding:
        18px
        40px;

    border-radius:18px;

    box-shadow:

        0 18px 35px
        rgba(16,64,51,.22),

        inset
        0 1px 0
        rgba(255,255,255,.13);

    font-family:
        'Playfair Display',
        serif;

    font-size:21px;

    transition:.3s;
}

.result-home-button:hover{

    transform:
        translateY(-4px);

    box-shadow:
        0 25px 45px
        rgba(16,64,51,.28);
}

.result-home-button small{

    display:block;

    margin-top:3px;

    font-family:Arial,sans-serif;

    font-size:9px;

    letter-spacing:2px;

    color:#d9c17a;
}


/* ==================================================
   RESPONSIVE HOME
================================================== */

@media(max-width:650px){

    #home{
        padding:
            18px
            10px
            60px;
    }

    .home-wrapper{
        width:100%;
    }

    .brand-box{
        min-height:360px;

        padding:
            35px
            15px
            35px;
    }

    .brand-logos{

        gap:12px;

    }

    .logo-card{

        width:45%;
    }

    .logo-card img{

        max-height:180px;
    }

    .brand-description{

        font-size:13px;

        margin-top:24px;
    }

    .result-home-button{

        width:100%;

        text-align:center;
    }

}

    </style><style>

/* ==================================================
   TABS
================================================== */

.tabs{

    width:min(620px,100%);

        30px;

/* ==================================================
   RESULT AREA
================================================== */

.result-area{

}


/* CATEGORY */

.category-box{

.category-box::before{

/* ==================================================
   COMPETITIONS
================================================== */

.competition-list{

    display:grid;

    gap:13px;
}

.competition{

    justify-content:space-between;

    padding:20px;

    border:

    box-shadow:

    transition:.3s;

    overflow:hidden;
}

.competition::before{

    content:"";

    position:absolute;

    left:0;
    top:0;

    width:3px;

    background:
        linear-gradient(

            #ead99f,
            #c8a85b

}

.competition:hover{

    transform:
        translateY(-3px);

}

.competition-info{

    padding-left:5px;

.stage-label{

    font-family:Arial,sans-serif;

    font-size:9px;

    letter-spacing:1.5px;

    text-transform:uppercase;

    margin-bottom:5px;
}

.competition-name{

    font-size:17px;

    color:#24483d;

    line-height:1.5;
}

.zone-badge{

    flex-shrink:0;

    background:#edf5f1;

    color:#28604e;

    padding:
        7px
        12px;

    border-radius:50px;

    font-family:Arial,sans-serif;

    font-size:9px;

    letter-spacing:1px;
}


/* ==================================================
   GALLERY
================================================== */

.gallery-area{

    display:none;

    padding-bottom:30px;
}


/* LIVE */

.gallery-live{

    background:#ffffff;

    border:
        1px solid
        #e0e8e3;

    border-radius:22px;

    padding:22px;

    box-shadow:

    position:relative;

    overflow:hidden;
}

.gallery-live::before{

    content:"";

    position:absolute;

    top:0;
    left:15%;
    right:15%;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #c8a85b,
            transparent
        );
}

.live-title{

    display:flex;

    align-items:center;

    gap:9px;

    margin-bottom:17px;

    font-weight:700;

    color:#173f33;
}

.live-dot{

    width:9px;
    height:9px;

    border-radius:50%;

    background:#d14d4d;

    box-shadow:
        0 0 0 5px
        rgba(209,77,77,.12);
}


/* YOUTUBE */

.youtube-box{

    display:flex;

    align-items:center;

    justify-content:center;

    min-height:130px;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #f8fbfa,
            #eef5f1
        );

    border:
        1px solid
        #e1e8e4;
}

.youtube-link{

    width:70px;
    height:50px;

    border-radius:15px;

    background:#ff0000;

    display:flex;

    align-items:center;

    justify-content:center;

    text-decoration:none;

    box-shadow:
        0 12px 25px
        rgba(255,0,0,.20);

    transition:.3s;
}

.youtube-link:hover{

    transform:
        scale(1.08)
        translateY(-2px);
}

.youtube-play{

    width:0;
    height:0;

    border-top:
        9px solid transparent;

    border-bottom:
        9px solid transparent;

    border-left:
        14px solid white;

    margin-left:4px;
}


/* GALLERY PHOTOS */

.gallery-photos{

    background:#ffffff;

    border:
        1px solid
        #e0e8e3;

    border-radius:22px;

    padding:22px;

    box-shadow:
        0 14px 35px
        rgba(25,70,55,.08);
}

.gallery-photo-title{

    font-weight:700;

    margin-bottom:5px;

    color:#173f33;
}

.gallery-photo-subtitle{

    font-size:11px;

    color:#78847e;

    margin-bottom:17px;
}

.photo-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;
}

.photo-grid img{

    width:100%;

    aspect-ratio:1/1;

    object-fit:cover;

    border-radius:15px;

    border:
        1px solid
        #e4d6ad;

    box-shadow:
        0 8px 18px
        rgba(0,0,0,.07);
}

.empty-gallery{

    padding:35px 10px;

    text-align:center;

    color:#8a9590;

    font-size:13px;
}


/* ==================================================
   RESPONSIVE
================================================== */

@media(max-width:650px){

    #mainPage{

        padding:
            18px

    }

        width:100%;

    }

    .tabs{

        margin-bottom:22px;
    }

    .tab{

        padding:13px 8px;

        font-size:13px;
    }

}

/* ==================================================
   OPENING → HOME
================================================== */

const opening =
document.getElementById("opening");

let opened = false;


function enterSite(){

    if(opened) return;

    opened = true;

    opening.style.transform =
        "translateY(-100%)";


    setTimeout(function(){

        opening.style.display =
            "none";

        document
            .getElementById("home")
            .classList.add("active");

    },1000);

}


/* CLICK OPENING */

opening.addEventListener(
    "click",
    enterSite
);


/* SWIPE */

let touchStartY = 0;


opening.addEventListener(
    "touchstart",
    function(e){

        touchStartY =
            e.touches[0].clientY;

    }
);


opening.addEventListener(
    "touchend",
    function(e){

        let touchEndY =
            e.changedTouches[0].clientY;


        if(
            touchStartY -
            touchEndY >
            40
        ){

            enterSite();

        }

    }
);


/* ==================================================
   HOME → RESULT / GALLERY
================================================== */

function openMainPage(){

    document
        .getElementById("home")
        .classList.remove("active");

    document
        .getElementById("competitionPage")
        .classList.remove("active");

    document
        .getElementById("mainPage")
        .classList.add("active");


    window.scrollTo(0,0);


    showResults();

    filterCompetitions();

}


/* ==================================================
   BACK TO HOME
================================================== */

function goHome(){

    document
        .getElementById("mainPage")
        .classList.remove("active");

    document
        .getElementById("competitionPage")
        .classList.remove("active");


    document
        .getElementById("home")
        .classList.add("active");


    window.scrollTo(0,0);

}


/* ==================================================
   RESULT TAB
================================================== */

function showResults(){

    document
        .getElementById("resultArea")
        .style.display =
        "block";


    document
        .getElementById("galleryArea")
        .style.display =
        "none";


    document
        .getElementById("resultTab")
        .classList.add("active");


    document
        .getElementById("galleryTab")
        .classList.remove("active");

}


/* ==================================================
   GALLERY TAB
================================================== */

function showGallery(){

    document

        .style.display =
        "none";


    document
        .getElementById("galleryArea")
        .style.display =
        "block";


    document
        .getElementById("resultTab")
        .classList.remove("active");


    document
        .getElementById("galleryTab")
        .classList.add("active");


    loadGallery();

}


/* ==================================================
   FILTER COMPETITIONS
================================================== */

function filterCompetitions(){

    const selected =
        document
        .getElementById("categorySelect")
        .value;


    const list =
        document
        .getElementById("competitionList");


    list.innerHTML = "";


    competitions
    .filter(function(comp){

        if(selected === "all"){

            return true;

        }

        return comp.zone === selected;

    })
    .forEach(function(comp){

        const item =
        document.createElement("div");


        item.className =
            "competition";


        item.onclick = function(){

            openCompetition(comp.id);

        };


        item.innerHTML = `

            <div class="competition-info">

                <span class="stage-label">
                    ${comp.stage}
                </span>

                <div class="competition-name">
                    ${comp.name}
                </div>

            </div>


            <div class="zone-badge">
                ${zoneName(comp.zone)}
            </div>

        `;


        list.appendChild(item);

    });

}


/* ==================================================
   ZONE NAME
================================================== */

function zoneName(zone){

    if(zone === "high")
        return "HIGH ZONE";


    if(zone === "mid")
        return "MID ZONE";


    if(zone === "low")
        return "LOW ZONE";


    if(zone === "general")
        return "GENERAL";


    return "";

}


/* ==================================================
   OPEN COMPETITION RESULT PAGE
================================================== */

let currentCompetition = null;


function openCompetition(id){

    const comp =
        competitions.find(
            function(item){

                return item.id === id;

            }
        );


    if(!comp) return;


    currentCompetition = comp;


    document
        .getElementById("mainPage")
        .classList.remove("active");


    document
        .getElementById("home")
        .classList.remove("active");


    document
        .getElementById("competitionPage")
        .classList.add("active");


    document
        .getElementById("competitionTitle")
        .textContent =
        comp.name;


    document
        .getElementById("competitionSubtitle")
        .textContent =
        comp.stage
        +
        "  •  "
        +
        zoneName(comp.zone);


    loadResultPhoto(comp);

    loadWinners(comp);


    window.scrollTo(0,0);

}


/* ==================================================
   RESULT PHOTO
================================================== */

function loadResultPhoto(comp){

    const photo =
        document
        .getElementById("resultPhoto");


    const noPhoto =
        document
        .getElementById("noResultPhoto");


    const download =
        document
        .getElementById("fullDownload");


    if(comp.photo){

        photo.src =
            comp.photo;


        photo.classList.remove(
            "hidden"
        );


        noPhoto.style.display =
            "none";


        download.href =
            comp.photo;


        download.style.display =
            "inline-block";

    }

    else{

        photo.src = "";

        photo.classList.add(
            "hidden"
        );


        noPhoto.style.display =
            "block";


        download.style.display =
            "none";

    }

}


/* ==================================================
   1st / 2nd / 3rd RESULT
================================================== */

function loadWinners(comp){

    const container =
        document
        .getElementById("winners");


    container.innerHTML = "";


    if(
        !comp.winners ||
        comp.winners.length === 0
    ){

        return;

    }


    comp.winners.forEach(
        function(person){

            const winner =
                document.createElement("div");


            winner.className =
                "winner";


            let rankSymbol = "";


            if(person.position === "1st"){

                rankSymbol = "🥇";

            }

            else if(
                person.position === "2nd"
            ){

                rankSymbol = "🥈";

            }

            else if(
                person.position === "3rd"
            ){

                rankSymbol = "🥉";

            }


            winner.innerHTML = `

                <div class="winner-rank">

                    ${rankSymbol}

                </div>


                <div class="winner-name">

                    <span
                        style="
                        display:block;
                        font-size:9px;
                        letter-spacing:2px;
                        color:#d9c17a;
                        margin-bottom:3px;
                        "
                    >

                        ${person.position}

                    </span>


                    ${
                        person.name
                        ?
                        person.name
                        :
                        "Result will be updated soon"
                    }

                </div>

            `;


            container.appendChild(winner);

        }
    );

}


/* ==================================================
   DOWNLOAD RESULT
================================================== */

function downloadResult(){

    if(
        currentCompetition &&
        currentCompetition.photo
    ){

        const link =
            document.createElement("a");


        link.href =
            currentCompetition.photo;


        link.download =
            currentCompetition.name
            +
            "-result";


        document
            .body
            .appendChild(link);


        link.click();


        document
            .body
            .removeChild(link);

    }

}


/* ==================================================
   YOUTUBE
================================================== */

function loadYoutube(){

    const link =
        document
        .getElementById("youtubeLink");


    if(youtubeURL){

        link.href =
            youtubeURL;


        link.style.opacity =
            "1";


        link.style.pointerEvents =
            "auto";

    }

    else{

        link.href =
            "#";


        link.style.opacity =
            ".45";


        link.style.pointerEvents =
            "none";

    }

}

        .getElementById("galleryGrid");


    grid.innerHTML = "";


    if(
        galleryPhotos.length === 0
    ){

        grid.innerHTML = `

            <div
                class="empty-gallery"
                style="grid-column:1/-1;">

                Photos will be added soon.

            </div>

        `;


        return;

    }


    galleryPhotos.forEach(
        function(photo){

            const img =
                document.createElement("img");


            img.src =
                photo;


            img.alt =
                "Gallery Photo";


            grid.appendChild(img);

        }
    );
